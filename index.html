function goPay(m, customAmt){
  const u = new URL(window.location.href);
  u.searchParams.set('page', 'pay');
  u.searchParams.set('mode', m);
  u.searchParams.set('ch', sel);
  if(customAmt){
    u.searchParams.set('amt', customAmt);
  } else {
    u.searchParams.delete('amt');
  }
  window.location.href = u.toString();
}

function goHome(){
  if(timerInterval) clearInterval(timerInterval);
  const u = new URL(window.location.href);
  u.searchParams.delete('page');
  u.searchParams.delete('mode');
  u.searchParams.delete('amt');
  window.location.href = u.toString();
}

function startTimer(durationSeconds) {
  if(timerInterval) clearInterval(timerInterval);
  let timer = durationSeconds;
  const display = document.getElementById('countdownTimer');
  if(!display) return;

  timerInterval = setInterval(function () {
    let minutes = parseInt(timer / 60, 10);
    let seconds = parseInt(timer % 60, 10);

    seconds = seconds < 10 ? "0" + seconds : seconds;
    display.textContent = minutes + " : " + seconds;

    if (--timer < 0) {
      clearInterval(timerInterval);
      display.textContent = "0 : 00";
    }
  }, 1000);
}

function copyUpiId(upiText, btnEl) {
  navigator.clipboard.writeText(upiText);
  const originalText = btnEl.innerText;
  btnEl.innerText = 'COPIED';
  btnEl.classList.replace('bg-[#1976d2]', 'bg-green-600');
  setTimeout(() => {
    btnEl.innerText = originalText;
    btnEl.classList.replace('bg-green-600', 'bg-[#1976d2]');
  }, 2000);
}

function submitPayUtr() {
  const utrVal = document.getElementById('payUtrInput').value.trim();
  if(!utrVal || utrVal.length < 12) {
    alert('Please enter a valid 12-digit UTR / Ref No.');
    document.getElementById('payUtrInput').focus();
    return;
  }
  alert('UTR (' + utrVal + ') submitted successfully! Verification in progress.');
}
