        </div>

      <input id="in_mobile" value="91750000058" class="w-full p-3 border rounded-lg text-sm bg-gray-50">

        </div>
        <div>
          <label class="text-xs font-bold block text-gray-700">Repayment Date</label>
          <input id="in_date" type="date" value="2026-11-14" class="w-full p-3 border rounded-lg text-sm bg-gray-50">
        </div>
      </div>
      
      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="text-xs font-bold block text-gray-700">Extension (₹)</label>
          <input id="in_ext" type="number" value="2400" class="w-full p-3 border rounded-lg text-sm bg-gray-50">
        </div>
        <div>
          <label class="text-xs font-bold block text-gray-700">Full Repay (₹)</label>
          <input id="in_full" type="number" value="6000" class="w-full p-3 border rounded-lg text-sm bg-gray-50">
        </div>
      </div>

      <label class="text-xs font-bold block text-gray-700">Channel 1 UPI (Required)</label>
      <input id="in_upi1" value="bharatpe.90065511470@fbpe" class="w-full p-3 border rounded-lg text-sm bg-gray-50">
      
      <label class="text-xs font-bold block text-gray-700">Channel 2 UPI (Optional)</label>
      <input id="in_upi2" placeholder="Optional" class="w-full p-3 border rounded-lg text-sm bg-gray-50">
      
      <label class="text-xs font-bold block text-gray-700">Channel 3 UPI (Optional)</label>
      <input id="in_upi3" placeholder="Optional" class="w-full p-3 border rounded-lg text-sm bg-gray-50">
      
      <label class="text-xs font-bold block text-gray-700">Channel 4 UPI (Optional)</label>
      <input id="in_upi4" placeholder="Optional" class="w-full p-3 border rounded-lg text-sm bg-gray-50">
      
      <label class="text-xs font-bold block text-gray-700">Channel 5 UPI (Optional)</label>
      <input id="in_upi5" placeholder="Optional" class="w-full p-3 border rounded-lg text-sm bg-gray-50">
      
      <button onclick="makeLink()" class="w-full bg-[#0083b0] text-white py-3 rounded-full font-bold mt-3 shadow hover:bg-[#006e94]">Generate Short Link</button>
      <div id="out"></div>
    </div>
  </div>

  <!-- Customer Portal View -->

      </div>
